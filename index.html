<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UnalandTech – Deutsches Wörterbuch</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Noto+Sans+Arabic:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090f;--card:#111827;--card2:#1a2235;--accent:#00b4f0;--a2:#0066cc;--text:#e8f4ff;--muted:#6b7fa3;--bs:rgba(255,255,255,.06);--bgl:rgba(0,180,240,.1)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}
#splash{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center}
#splash::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 40%,rgba(0,80,200,.18),transparent 70%);pointer-events:none}
.spl{width:96px;height:96px;object-fit:contain;filter:drop-shadow(0 0 28px rgba(0,180,240,.5));animation:flt 3s ease-in-out infinite;margin-bottom:1rem}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.spt{font-size:1.8rem;font-weight:300;letter-spacing:.5px;margin-bottom:.2rem}
.spt span{color:var(--accent);font-weight:600}
.sps{font-size:.75rem;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-bottom:2.5rem}
.spp{font-size:.85rem;color:var(--muted);margin-bottom:1rem}
.lg{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;width:320px}
.lb{background:rgba(0,180,240,.05);border:1px solid var(--bgl);border-radius:14px;padding:.9rem 1rem;cursor:pointer;display:flex;align-items:center;gap:.7rem;color:var(--text);font-family:'DM Sans',sans-serif;transition:all .22s}
.lb:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,180,240,.2)}
.lf{font-size:1.6rem}.ln{font-size:.92rem;font-weight:500}.lsub{font-size:.68rem;color:var(--muted);margin-top:.05rem}
.spbr{position:absolute;bottom:1.2rem;font-size:.65rem;color:rgba(107,127,163,.4)}
.spbr span{color:rgba(0,180,240,.4)}
#splash.out{animation:spOut .4s forwards}
@keyframes spOut{to{opacity:0;pointer-events:none}}
#app{display:none;flex-direction:column;min-height:100vh}
#app.in{animation:appIn .4s forwards}
@keyframes appIn{from{opacity:0}to{opacity:1}}
header{background:rgba(7,9,15,.96);backdrop-filter:blur(20px);border-bottom:1px solid var(--bs);padding:.65rem 1.2rem;position:sticky;top:0;z-index:100}
.hr{display:flex;align-items:center;gap:.65rem;margin-bottom:.6rem}
.hl{height:28px;width:28px;object-fit:contain;opacity:.8}
.hb{font-size:.8rem;font-weight:400;color:var(--muted)}.hb span{color:rgba(0,180,240,.7);font-weight:500}
.swb{margin-left:auto;background:rgba(255,255,255,.04);border:1px solid var(--bs);border-radius:7px;padding:.32rem .7rem;color:var(--muted);font-size:.72rem;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .18s}
.swb:hover{color:var(--accent);border-color:var(--bgl)}
.ctrl{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
input{background:rgba(255,255,255,.04);border:1px solid var(--bs);color:var(--text);padding:.38rem .85rem;border-radius:7px;font-size:.8rem;width:185px;outline:none;font-family:'DM Sans',sans-serif;transition:border .2s}
input:focus{border-color:var(--accent)}
input::placeholder{color:var(--muted)}
.fb{background:rgba(255,255,255,.04);border:1px solid var(--bs);color:var(--muted);padding:.3rem .65rem;border-radius:14px;font-size:.73rem;cursor:pointer;transition:all .18s;font-family:'DM Sans',sans-serif}
.fb:hover,.fb.on{background:var(--a2);border-color:var(--accent);color:#fff}
.stat{color:var(--muted);font-size:.72rem;margin-left:auto}
main{padding:1rem 1.2rem;max-width:1400px;margin:0 auto;flex:1}
.sec{margin-bottom:2rem}
.sh{display:flex;align-items:center;gap:.6rem;margin-bottom:.75rem;padding-bottom:.55rem;border-bottom:1px solid var(--bs)}
.si{font-size:.95rem}.st{font-size:1rem;font-weight:500}
.sb{padding:.12rem .55rem;border-radius:14px;font-size:.67rem;font-weight:500}
.bi{background:rgba(0,102,204,.18);color:#60a5fa;border:1px solid rgba(0,102,204,.25)}
.bf{background:rgba(0,180,100,.13);color:#34d399;border:1px solid rgba(0,180,100,.25)}
.bs2{background:rgba(200,130,0,.13);color:#fbbf24;border:1px solid rgba(200,130,0,.25)}
.bz{background:rgba(139,92,246,.13);color:#c084fc;border:1px solid rgba(139,92,246,.22)}
.bgr{background:rgba(0,180,240,.12);color:#67e8f9;border:1px solid rgba(0,180,240,.25)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:.45rem}
/* WORD CARD */
.wc{background:var(--card);border:1px solid var(--bs);border-radius:10px;padding:.65rem .85rem;cursor:pointer;transition:transform .14s,border-color .14s,background .14s}
.wc:hover{transform:translateY(-1px);border-color:rgba(0,180,240,.3);background:var(--card2)}
.wtop{display:flex;align-items:flex-start;gap:.55rem}
.ab{font-size:.58rem;font-weight:700;padding:.1rem .38rem;border-radius:4px;flex-shrink:0;margin-top:2px;letter-spacing:.4px;text-transform:uppercase}
.ader{background:#1d4ed8;color:#fff}.adie{background:#be123c;color:#fff}.adas{background:#15803d;color:#fff}
.av{background:#0e7490;color:#fff}.aadj{background:#92400e;color:#fff}.aadv{background:#6b21a8;color:#fff}
.wb{flex:1;min-width:0}
.wde{font-weight:500;font-size:.88rem;line-height:1.3}
.wi{font-size:.67rem;color:var(--accent);margin-top:.08rem;opacity:.8}
.wtr{font-size:.79rem;color:var(--muted);margin-top:.13rem;line-height:1.3}
.wtr.rtl{direction:rtl;text-align:right;font-family:'Noto Sans Arabic',sans-serif}
.wu{font-size:.58rem;padding:.06rem .3rem;border-radius:3px;background:rgba(255,255,255,.05);color:var(--muted);flex-shrink:0;margin-top:2px}
.wd{display:none;margin-top:.45rem;padding-top:.45rem;border-top:1px solid var(--bs)}
.wc.exp .wd{display:block}
/* CONJUNCTION CARD */
.wc.c-neben{border-left:2px solid #f59e0b}
.wc.c-haupt{border-left:2px solid #34d399}
.wc.c-konj{border-left:2px solid #c084fc}
.wc.c-zweiteilig{border-left:2px solid #67e8f9}
/* DETAIL */
.elbl{font-size:.62rem;color:var(--accent);font-weight:500;letter-spacing:.5px;text-transform:uppercase;margin-bottom:.2rem;opacity:.7}
.exde{font-size:.78rem;color:var(--text);font-style:italic;line-height:1.5;margin-bottom:.15rem}
.extr{font-size:.74rem;color:var(--muted);line-height:1.4}
.extr.rtl{direction:rtl;font-family:'Noto Sans Arabic',sans-serif;text-align:right}
.pills{display:flex;flex-wrap:wrap;gap:.28rem;margin-top:.32rem}
.pill{font-size:.62rem;padding:.1rem .45rem;border-radius:10px;font-weight:500}
.pd{background:rgba(16,185,129,.15);color:#34d399;border:1px solid rgba(16,185,129,.25)}
.pa{background:rgba(239,68,68,.13);color:#f87171;border:1px solid rgba(239,68,68,.22)}
.pp{background:rgba(139,92,246,.15);color:#c084fc;border:1px solid rgba(139,92,246,.22)}
.ps{background:rgba(245,158,11,.13);color:#fbbf24;border:1px solid rgba(245,158,11,.22)}
.pn{background:rgba(107,127,163,.1);color:var(--muted);border:1px solid var(--bs)}
.pst{background:rgba(0,102,204,.15);color:#60a5fa;border:1px solid rgba(0,102,204,.22)}
/* GRAMMAR NOTE */
.gnote{margin-top:.35rem;font-size:.74rem;line-height:1.6;padding:.35rem .55rem;border-radius:0 6px 6px 0}
.gnote.rtl{direction:rtl;font-family:'Noto Sans Arabic',sans-serif;text-align:right;border-radius:6px 0 0 6px}
.gn-neben{background:rgba(245,158,11,.07);border-left:2px solid rgba(245,158,11,.5);color:rgba(251,191,36,.9)}
.gn-neben.rtl{border-left:none;border-right:2px solid rgba(245,158,11,.5)}
.gn-haupt{background:rgba(16,185,129,.06);border-left:2px solid rgba(52,211,153,.5);color:rgba(52,211,153,.9)}
.gn-haupt.rtl{border-left:none;border-right:2px solid rgba(52,211,153,.5)}
.gn-konj{background:rgba(139,92,246,.07);border-left:2px solid rgba(192,132,252,.5);color:rgba(192,132,252,.9)}
.gn-konj.rtl{border-left:none;border-right:2px solid rgba(192,132,252,.5)}
.gn-zweiteilig{background:rgba(0,180,240,.06);border-left:2px solid rgba(103,232,249,.5);color:rgba(103,232,249,.9)}
.gn-zweiteilig.rtl{border-left:none;border-right:2px solid rgba(103,232,249,.5)}
/* VERB GRAMMAR */
.znote{margin-top:.35rem;font-size:.74rem;color:rgba(107,127,163,.9);line-height:1.5;background:rgba(139,92,246,.06);border-left:2px solid rgba(139,92,246,.35);padding:.3rem .5rem;border-radius:0 5px 5px 0}
.znote.rtl{border-left:none;border-right:2px solid rgba(139,92,246,.35);text-align:right;font-family:'Noto Sans Arabic',sans-serif}
/* ARTIKEL TABLE */
.art-tbl{width:100%;border-collapse:collapse;font-size:.75rem;margin-top:.4rem}
.art-tbl th{background:rgba(0,102,204,.2);color:#60a5fa;padding:.3rem .4rem;text-align:left;font-weight:600}
.art-tbl th.rtl-h,.art-tbl td.rtl-h{text-align:right}
.art-tbl td{padding:.28rem .4rem;border-top:1px solid var(--bs);color:var(--muted)}
.art-tbl td.kw{color:var(--text);font-weight:500}
.art-tbl td.der{color:#60a5fa}.art-tbl td.die{color:#f87171}.art-tbl td.das{color:#4ade80}
.art-tbl tr:hover td{background:rgba(255,255,255,.03)}
.art-ex{font-size:.74rem;color:var(--muted);margin-top:.3rem;line-height:1.6}
.art-ex b{color:var(--text)}
.art-ex .de{font-style:italic;color:#a5f3fc}
.art-ex .tr{color:var(--muted)}
/* LEGEND */
.legend{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:.8rem;font-size:.68rem}
.leg{padding:.18rem .5rem;border-radius:12px;font-weight:500}
.leg-n{background:rgba(245,158,11,.12);color:#fbbf24;border:1px solid rgba(245,158,11,.3)}
.leg-h{background:rgba(16,185,129,.1);color:#34d399;border:1px solid rgba(16,185,129,.3)}
.leg-k{background:rgba(139,92,246,.1);color:#c084fc;border:1px solid rgba(139,92,246,.3)}
.leg-z{background:rgba(0,180,240,.08);color:#67e8f9;border:1px solid rgba(0,180,240,.3)}
footer{border-top:1px solid var(--bs);padding:.65rem 1.2rem;display:flex;align-items:center;gap:.55rem;justify-content:center}
.fl{height:20px;opacity:.4}
.ft{font-size:.65rem;color:rgba(107,127,163,.45)}.ft span{color:rgba(0,180,240,.4)}
@media(max-width:600px){.lg{width:calc(100% - 2rem)}header,main{padding:.8rem 1rem}.grid{grid-template-columns:1fr}input{width:100%}}

#game-view{display:none;max-width:520px;margin:0 auto;padding:1rem 1.2rem;flex:1;flex-direction:column}
#game-view.active{display:flex}
.game-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.game-title{font-size:.95rem;font-weight:500}
.game-scores{display:flex;gap:1rem}
.gs{text-align:center}.gs-num{font-size:1.2rem;font-weight:700}.gs-num.ok{color:#10b981}.gs-num.err{color:#ef4444}.gs-lbl{font-size:.62rem;color:var(--muted)}
.game-prog{background:rgba(255,255,255,.06);border-radius:4px;height:4px;margin-bottom:1.4rem;overflow:hidden}
.game-prog-fill{height:100%;background:linear-gradient(90deg,var(--a2),var(--accent));border-radius:4px;transition:width .5s}
.game-card{background:var(--card);border:1px solid var(--bs);border-radius:18px;padding:2.5rem 1.5rem;text-align:center;margin-bottom:1.2rem;min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;transition:border-color .35s,background .35s}
.game-card.flash-ok{border-color:#10b981;background:rgba(16,185,129,.07)}
.game-card.flash-err{border-color:#ef4444;background:rgba(239,68,68,.07)}
.gc-unit{font-size:.62rem;color:var(--muted);letter-spacing:1px;margin-bottom:.2rem}
.gc-word{font-size:2rem;font-weight:600;color:var(--text);line-height:1.2}
.gc-hint{font-size:.78rem;color:var(--muted);margin-top:.3rem}
.gc-result{font-size:.82rem;font-weight:600;margin-top:.2rem;min-height:1.2em}
.gc-result.ok{color:#10b981}.gc-result.err{color:#ef4444}
.art-btns{display:flex;gap:.75rem;justify-content:center;margin-bottom:1rem}
.art-btn{width:90px;padding:.85rem;border-radius:12px;font-size:1.1rem;font-weight:700;cursor:pointer;border:2px solid var(--bs);background:var(--card);color:var(--text);transition:all .18s;font-family:'DM Sans',sans-serif}
.art-btn:hover:not(:disabled){transform:scale(1.06)}
.art-btn.b-der:hover{border-color:#1d4ed8;color:#60a5fa;background:rgba(29,78,216,.1)}
.art-btn.b-die:hover{border-color:#be123c;color:#f87171;background:rgba(190,18,60,.1)}
.art-btn.b-das:hover{border-color:#15803d;color:#4ade80;background:rgba(21,128,61,.1)}
.art-btn.sel-ok{border-color:#10b981!important;background:rgba(16,185,129,.15)!important;color:#10b981!important}
.art-btn.sel-err{border-color:#ef4444!important;background:rgba(239,68,68,.1)!important;color:#ef4444!important}
.art-btn.reveal-ok{border-color:#10b981!important;background:rgba(16,185,129,.1)!important;color:#10b981!important}
.art-btn:disabled{cursor:default}
.game-nav{display:flex;gap:.65rem;justify-content:center;margin-top:.3rem}
.game-btn{background:rgba(0,180,240,.1);border:1px solid var(--bgl);border-radius:9px;padding:.55rem 1.3rem;color:var(--accent);font-size:.82rem;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500;transition:all .2s}
.game-btn:hover{background:rgba(0,180,240,.2)}
.game-btn.prim{background:var(--a2);border-color:var(--accent);color:#fff}
.weight-bar{display:flex;align-items:center;gap:.4rem;font-size:.65rem;color:var(--muted);margin-top:.6rem;justify-content:center}
.wb-dot{width:6px;height:6px;border-radius:50%;background:var(--muted);transition:background .3s}.wb-dot.hot{background:#ef4444}
.game-filter{display:flex;gap:.4rem;flex-wrap:wrap;justify-content:center;margin-bottom:.8rem}
.gf-btn{background:rgba(255,255,255,.04);border:1px solid var(--bs);color:var(--muted);padding:.28rem .6rem;border-radius:12px;font-size:.7rem;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .18s}
.gf-btn:hover,.gf-btn.on{background:var(--a2);border-color:var(--accent);color:#fff}
.game-result-screen{text-align:center;padding:2rem 1rem}
.gr-emoji{font-size:3.5rem;margin-bottom:.8rem}.gr-title{font-size:1.4rem;font-weight:600;margin-bottom:.4rem}.gr-sub{color:var(--muted);font-size:.88rem;margin-bottom:1.5rem}
.gr-stats{display:flex;justify-content:center;gap:2rem;margin-bottom:1.5rem}
.grs-num{font-size:1.8rem;font-weight:700}.grs-lbl{font-size:.68rem;color:var(--muted)}
</style>
<!-- PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UnalandTech">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07090f">
<link rel="apple-touch-icon" id="pwa-icon" href="">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%20%22UnalandTech%20%5Cu2013%20Deutsches%20W%5Cu00f6rterbuch%22%2C%20%22short_name%22%3A%20%22UnalandTech%22%2C%20%22description%22%3A%20%22B1.1%20Almanca%20Kelime%20Hazinesi%22%2C%20%22start_url%22%3A%20%22./%22%2C%20%22display%22%3A%20%22standalone%22%2C%20%22background_color%22%3A%20%22%2307090f%22%2C%20%22theme_color%22%3A%20%22%2307090f%22%2C%20%22orientation%22%3A%20%22portrait-primary%22%2C%20%22icons%22%3A%20%5B%7B%22src%22%3A%20%22data%3Aimage/svg%2Bxml%2C%253Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20100%20100%27%253E%253Crect%20width%3D%27100%27%20height%3D%27100%27%20rx%3D%2716%27%20fill%3D%27%252307090f%27/%253E%253Ctext%20y%3D%2772%27%20x%3D%2710%27%20font-size%3D%2775%27%253E%25F0%259F%2587%25A9%25F0%259F%2587%25AA%253C/text%253E%253C/svg%253E%22%2C%20%22sizes%22%3A%20%22any%22%2C%20%22type%22%3A%20%22image/svg%2Bxml%22%2C%20%22purpose%22%3A%20%22any%20maskable%22%7D%5D%7D">
</head>
<body>
<div id="splash">
  <img class="spl ulogo" src="" alt="UnalandTech">
  <div class="spt">Unaland<span>Tech</span></div>
  <div class="sps">Deutsches Wörterbuch</div>
  <div class="spp">Bitte wählen Sie eine Sprache</div>
  <div class="lg">
    <button class="lb" onclick="selectLang('tr')"><span class="lf">🇹🇷</span><div><div class="ln">Türkisch</div><div class="lsub">Türkçe</div></div></button>
    <button class="lb" onclick="selectLang('en')"><span class="lf">🇬🇧</span><div><div class="ln">Englisch</div><div class="lsub">English</div></div></button>
    <button class="lb" onclick="selectLang('ar')"><span class="lf">🇸🇦</span><div><div class="ln">Arabisch</div><div class="lsub">العربية</div></div></button>
    <button class="lb" onclick="selectLang('fa')"><span class="lf">🇮🇷</span><div><div class="ln">Persisch</div><div class="lsub">فارسی</div></div></button>
  </div>
  <div class="spbr">© 2026 <span>UnalandTech</span></div>
</div>
<div id="app">
  <header>
    <div class="hr">
      <img class="hl ulogo" src="" alt="">
      <div class="hb">Unaland<span>Tech</span></div>
      <button class="swb" id="swb" onclick="backToSplash()">🌐 Dil Değiştir</button>
    </div>
    <div class="ctrl">
      <input id="srch" type="text" placeholder="🔍 Kelime ara…" oninput="render()">
      <div style="display:flex;gap:.4rem;flex-wrap:wrap">
        <button class="fb on" data-t="all"   onclick="setType('all',this)">Tümü</button>
        <button class="fb"    data-t="isim"  onclick="setType('isim',this)">İsimler</button>
        <button class="fb"    data-t="fiil"  onclick="setType('fiil',this)">Fiiller</button>
        <button class="fb"    data-t="sifat" onclick="setType('sifat',this)">Sıfatlar</button>
        <button class="fb"    data-t="zarf"  onclick="setType('zarf',this)">Zarflar</button>
        <button class="fb"    data-t="gr"    onclick="setType('gr',this)">📚 Gramer</button>
        <button class="fb" data-t="game" id="btn-game-lbl" onclick="setType('game',this)">🎮 Artikel Oyunu</button>
      </div>
      <div style="display:flex;gap:.4rem;flex-wrap:wrap">
        <button class="fb on" data-u="0" onclick="setUnit(0,this)">Tüm Üniteler</button>
        <button class="fb"    data-u="1" onclick="setUnit(1,this)">Ünite 1</button>
        <button class="fb"    data-u="2" onclick="setUnit(2,this)">Ünite 2</button>
        <button class="fb"    data-u="3" onclick="setUnit(3,this)">Ünite 3</button>
        <button class="fb"    data-u="4" onclick="setUnit(4,this)">Ünite 4</button>
        <button class="fb"    data-u="5" onclick="setUnit(5,this)">Ünite 5</button>
        <button class="fb"    data-u="6" onclick="setUnit(6,this)">Ünite 6</button>
        <button class="fb"    data-u="7" onclick="setUnit(7,this)">Ünite 7</button>
        <button class="fb"    data-u="8" onclick="setUnit(8,this)">Ünite 8</button>
        <button class="fb"    data-u="9" onclick="setUnit(9,this)">📚</button>
      </div>
      <span class="stat" id="stat"></span>
    </div>
  </header>
  <main id="wlist"></main>
  <footer>
    <img class="fl ulogo" src="" alt="">
    <div class="ft">© 2026 <span>UnalandTech</span> · Deutsches Wörterbuch</div>
  </footer>
  <!-- ARTIKEL GAME -->
  <div id="game-view">
    <div id="ga-start">
      <div style="text-align:center;padding:1.5rem 0 1rem">
        <div style="font-size:2.5rem;margin-bottom:.6rem">🏷️</div>
        <div style="font-size:1.1rem;font-weight:500;margin-bottom:.3rem" id="ga-start-title">Artikel Oyunu</div>
        <div style="font-size:.8rem;color:var(--muted);margin-bottom:1.5rem" id="ga-start-sub">Ünite seçip oyna</div>
      </div>

let lang='tr', typ='all', unt=0;

function selectLang(l){
  lang=l;
  document.getElementById('splash').classList.add('out');
  setTimeout(()=>{
    document.getElementById('splash').style.display='none';
    const ap=document.getElementById('app');
    ap.style.display='flex'; ap.classList.add('in');
    applyUI(); render();
  },400);
}
function backToSplash(){
  document.getElementById('app').style.display='none';
  const sp=document.getElementById('splash');
  sp.style.display='flex'; sp.classList.remove('out');
}
function applyUI(){
  const u=UI[lang];
  document.body.setAttribute('dir',u.rtl?'rtl':'ltr');
  document.getElementById('swb').textContent=u.sw;
  document.getElementById('srch').placeholder=u.search;
  document.querySelector('[data-t="all"]').textContent=u.all;
  document.querySelector('[data-t="isim"]').textContent=u.nouns;
  document.querySelector('[data-t="fiil"]').textContent=u.verbs;
  document.querySelector('[data-t="sifat"]').textContent=u.adj;
  document.querySelector('[data-t="zarf"]').textContent=u.adv;
  document.querySelector('[data-t="gr"]').textContent=u.gr;
  document.querySelector('[data-u="0"]').textContent=u.units;
  for(let i=1;i<=8;i++){
    const b=document.querySelector('[data-u="'+i+'"]');
    if(b) b.textContent=u.unitLbl+' '+i;
  }
  const bg=document.querySelector('[data-u="9"]');
  if(bg) bg.textContent='📚';
  const gbtn=document.getElementById('btn-game-lbl');
  if(gbtn) gbtn.textContent=(GAME_UI[lang]||GAME_UI.tr).gameBtn;
}
function setType(t,b){
  document.querySelectorAll('[data-t]').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  var gv=document.getElementById('game-view');
  var ml=document.getElementById('wlist');
  if(t==='game'){
    ml.style.display='none';
    gv.style.display='flex';gv.classList.add('active');
    document.getElementById('ga-start').style.display='block';
    document.getElementById('ga-active').style.display='none';
    document.getElementById('ga-result-screen').style.display='none';
    gBuildStart();
    document.getElementById('stat').textContent='';
  } else {
    gv.style.display='none';gv.classList.remove('active');
    ml.style.display='block';
    typ=t;render();
  }
}
function setUnit(u,b){unt=u;document.querySelectorAll('[data-u]').forEach(x=>x.classList.remove('on'));b.classList.add('on');render();}
function togCard(el){el.classList.toggle('exp');}

function artCls(a){return{der:'ader',die:'adie',das:'adas',v:'av',adj:'aadj',adv:'aadv'}[a]||'aadv';}
function artLbl(a){
  const u=UI[lang];
  if(a==='der')return 'DER'; if(a==='die')return 'DIE'; if(a==='das')return 'DAS';
  if(a==='v')return u.vLbl; if(a==='adj')return u.aLbl; if(a==='adv')return u.dLbl;
  return a.toUpperCase();
}
function getTr(w){return w[lang]||w.tr;}
function getEx(w){
  const de=w.ex_de||'';
  const tr=lang==='en'?w.ex_en:lang==='ar'?w.ex_ar:lang==='fa'?w.ex_fa:w.ex_tr;
  return{de,tr:tr||''};
}
function transInfo(info){
  if(!info)return '';
  const m=UI[lang].infoMap||{};
  let r=info;
  Object.keys(m).sort((a,b)=>b.length-a.length).forEach(k=>{
    if(r.includes(k))r=r.split(k).join(m[k]);
  });
  return r;
}
function makePills(w){
  const u=UI[lang]; const pills=[];
  if(w.sep===true)  pills.push('<span class="pill ps">'+u.sep+'</span>');
  if(w.sep===false) pills.push('<span class="pill pn">'+u.nosep+'</span>');
  if(w.strong)      pills.push('<span class="pill pst">'+u.strong+'</span>');
  if(w.case&&w.case!=='—'){
    w.case.split('+').forEach(c=>{
      pills.push('<span class="pill '+(c.includes('Dativ')?'pd':'pa')+'">'+c+'</span>');
    });
  }
  if(w.prep&&w.prep.length) pills.push('<span class="pill pp">+ '+w.prep.join(' / ')+'</span>');
  return pills.length?'<div class="pills">'+pills.join('')+'</div>':'';
}
function getZarfNote(w){
  const notes=ZARF_NOTES[lang]||ZARF_NOTES.tr;
  return notes[w.de]||null;
}

// Build Artikel/Relativsatz table HTML
function buildArtikelCard(){
  const u=UI[lang]; const isRTL=u.rtl;
  const rtlC=isRTL?' rtl':'';
  let h='<div class="wc" style="cursor:default;border-color:rgba(0,180,240,.25)">'
    +'<div class="wtop"><div class="wb">'
    +'<div class="wde" style="color:var(--accent);font-size:.82rem">'+u.artTitle+'</div>'
    +'<div class="wi">'+u.artSub+'</div></div></div>'
    +'<div style="margin-top:.5rem">'
    // table
    +'<table class="art-tbl">'
    +'<thead><tr>';
  u.artCols.forEach((c,i)=>{
    h+='<th'+(isRTL?' class="rtl-h"':'')+(i>1?' class="'+(isRTL?'rtl-h ':'')+'"':'')+'>'+c+'</th>';
  });
  h+='</tr></thead><tbody>';
  u.artRows.forEach(row=>{
    h+='<tr><td class="kw'+(isRTL?' rtl-h':'')+'">'+row[0]+'</td>'
      +'<td class="der">'+row[1]+'</td>'
      +'<td class="die">'+row[2]+'</td>'
      +'<td class="das">'+row[3]+'</td>'
      +'<td>'+row[4]+'</td></tr>';
  });
  h+='</tbody></table>';
  // relative clause note
  h+='<div class="gnote gn-neben'+rtlC+'" style="margin-top:.5rem">'+u.artRelNote+'</div>';
  // examples
  h+='<div class="elbl" style="margin-top:.5rem">'+u.exLbl+'</div>';
  u.artExamples.forEach(ex=>{
    h+='<div class="art-ex"><span class="de">'+ex.de+'</span><br>'
      +'<span class="tr'+(isRTL?' rtl-h':'')+(isRTL?' style=\\"direction:rtl\\"':'')+'">'+ex.tr+'</span></div>';
  });
  h+='</div></div>';
  return h;
}

// Build conjunction legend
function buildLegend(){
  const u=UI[lang];
  return '<div class="legend">'
    +'<span class="leg leg-n">'+u.conjLabels.neben+'</span>'
    +'<span class="leg leg-h">'+u.conjLabels.haupt+'</span>'
    +'<span class="leg leg-k">'+u.conjLabels.konj+'</span>'
    +'<span class="leg leg-z">'+u.conjLabels.zweiteilig+'</span>'
    +'</div>';
}

function render(){
  const u=UI[lang]; const isRTL=u.rtl;
  const q=document.getElementById('srch').value.toLowerCase();
  let html='';

  // Grammar section (unit 9 or type=gr)
  if(unt===9||typ==='gr'){
    html+='<div class="sec"><div class="sh"><span class="si">📚</span><h2 class="st">'+u.sGR+'</h2></div>';
    html+=buildLegend();
    // Artikel card
    html+='<div style="margin-bottom:.45rem">'+buildArtikelCard()+'</div>';
    html+='<div class="grid">';
    // Conjunction words
    const cwords=CONJ_WORDS.filter(w=>{
      if(q&&!w.de.toLowerCase().includes(q)&&!getTr(w).toLowerCase().includes(q))return false;
      return true;
    });
    cwords.forEach(w=>{ html+=buildConjCard(w,u,isRTL); });
    html+='</div></div>';
    document.getElementById('wlist').innerHTML=html;
    document.getElementById('stat').textContent=u.stats(cwords.length+1);
    return;
  }

  // Normal word sections
  const secs=[
    {k:'isim',l:u.sN,b:'bi',i:'📖'},
    {k:'fiil', l:u.sV,b:'bf',i:'⚡'},
    {k:'sifat',l:u.sA,b:'bs2',i:'🎨'},
    {k:'zarf', l:u.sZ,b:'bz',i:'🔗'},
  ];
  let total=0;
  for(const s of secs){
    if(typ!=='all'&&typ!==s.k) continue;
    const items=words.filter(w=>{
      if(w.type!==s.k)return false;
      if(w.unit===9)return false; // conjunctions only in grammar section
      if(unt!==0&&w.unit!==unt)return false;
      if(q&&!w.de.toLowerCase().includes(q)&&!getTr(w).toLowerCase().includes(q))return false;
      return true;
    });
    if(!items.length)continue;
    total+=items.length;
    html+='<div class="sec"><div class="sh"><span class="si">'+s.i+'</span><h2 class="st">'+s.l+'</h2>'
         +'<span class="sb '+s.b+'">'+u.stats(items.length)+'</span></div><div class="grid">';
    for(const w of items) html+=buildWordCard(w,u,isRTL);
    html+='</div></div>';
  }
  document.getElementById('wlist').innerHTML=html;
  document.getElementById('stat').textContent=u.stats(total);
}

function buildWordCard(w,u,isRTL){
  const badge=['der','die','das','v','adj','adv'].includes(w.art)
    ?'<span class="ab '+artCls(w.art)+'">'+artLbl(w.art)+'</span>':'';
  const infoTr=transInfo(w.info);
  const ex=getEx(w);
  let det='';
  if(ex.de){
    det+='<div class="elbl">'+u.exLbl+'</div>';
    det+='<div class="exde">'+ex.de+'</div>';
    if(ex.tr)det+='<div class="extr'+(isRTL?' rtl':'')+'">'+ex.tr+'</div>';
  }
  if(w.type==='fiil'){
    const pills=makePills(w);
    if(pills)det+='<div class="elbl" style="margin-top:.4rem">'+u.grLbl+'</div>'+pills;
  }
  if(w.type==='zarf'){
    const note=getZarfNote(w);
    if(note)det+='<div class="elbl" style="margin-top:.4rem">'+u.grLbl+'</div>'
                +'<div class="znote'+(isRTL?' rtl':'')+'">'+note+'</div>';
  }
  const hasdet=det.length>0;
  return '<div class="wc"'+(hasdet?' onclick="togCard(this)"':'')+'>'
        +'<div class="wtop">'+badge
        +'<div class="wb">'
        +'<div class="wde">'+w.de+'</div>'
        +(infoTr?'<div class="wi">'+infoTr+'</div>':'')
        +'<div class="wtr'+(isRTL?' rtl':'')+'">'+getTr(w)+'</div>'
        +'</div>'
        +'<span class="wu">Ü'+w.unit+'</span>'
        +'</div>'
        +(hasdet?'<div class="wd">'+det+'</div>':'')
        +'</div>';
}

function buildConjCard(w,u,isRTL){
  const ex=getEx(w);
  const cat=w.conj||'konj';
  const catLabel=u.conjLabels[cat]||cat;
  const catNote=u.conjNotes[cat]||'';
  let det='';
  if(ex.de){
    det+='<div class="elbl">'+u.exLbl+'</div>';
    det+='<div class="exde">'+ex.de+'</div>';
    if(ex.tr)det+='<div class="extr'+(isRTL?' rtl':'')+'">'+ex.tr+'</div>';
  }
  if(catNote){
    det+='<div class="elbl" style="margin-top:.4rem">'+u.grLbl+'</div>';
    det+='<div class="gnote gn-'+cat+(isRTL?' rtl':'')+'">'+catNote.replace(/\n/g,'<br>')+'</div>';
  }
  return '<div class="wc c-'+cat+'" onclick="togCard(this)">'
        +'<div class="wtop">'
        +'<div class="wb">'
        +'<div class="wde">'+w.de+'</div>'
        +'<div class="wi">'+catLabel+'</div>'
        +'<div class="wtr'+(isRTL?' rtl':'')+'">'+getTr(w)+'</div>'
        +'</div>'
        +'</div>'
        +'<div class="wd">'+det+'</div>'
        +'</div>';
}

var gPool=[],gUnit=0,gCurrent=null,gCorrect=0,gWrong=0,gAnswered=false,gRound=0;
var G_ROUND=20;
function gGetNouns(u){return words.filter(function(w){return w.type==='isim'&&['der','die','das'].indexOf(w.art)>=0&&(u===0||w.unit===u);});}
function gInitPool(u){
  var nouns=gGetNouns(u);
  var saved={};try{var s=sessionStorage.getItem('aw'+u);if(s)saved=JSON.parse(s);}catch(e){}
  gPool=nouns.map(function(w){return{word:w,weight:saved[w.de]?saved[w.de].w:1,seen:saved[w.de]?saved[w.de].s:0,wrong:saved[w.de]?saved[w.de].e:0};});
}
function gSave(){
  var d={};gPool.forEach(function(p){d[p.word.de]={w:p.weight,s:p.seen,e:p.wrong};});
  try{sessionStorage.setItem('aw'+gUnit,JSON.stringify(d));}catch(e){}
}
function gPick(){
  if(!gPool.length)return null;
  var unseen=gPool.filter(function(p){return p.seen===0;});
  if(unseen.length>0&&Math.random()<0.4)return unseen[Math.floor(Math.random()*unseen.length)];
  var total=gPool.reduce(function(s,p){return s+p.weight;},0);
  var r=Math.random()*total;
  for(var i=0;i<gPool.length;i++){r-=gPool[i].weight;if(r<=0)return gPool[i];}
  return gPool[gPool.length-1];
}
function gApplyUI(){
  var gu=GAME_UI[lang]||GAME_UI.tr;
  document.getElementById('ga-title').textContent=gu.title;
  document.getElementById('ga-ok-lbl').textContent=gu.okLbl;
  document.getElementById('ga-err-lbl').textContent=gu.errLbl;
  document.getElementById('ga-back').textContent=gu.back;
  document.getElementById('ga-back').onclick=function(){gBack();};
  document.getElementById('ga-next').textContent=gu.next;
}
function gBuildStart(){
  gApplyUI();
  var gu=GAME_UI[lang]||GAME_UI.tr;
  var gbtn=document.getElementById('btn-game-lbl');if(gbtn)gbtn.textContent=gu.gameBtn;
  document.getElementById('ga-start-title').textContent=gu.title;
  document.getElementById('ga-start-sub').textContent=gu.subText;
  var sel=document.getElementById('gf-unit-sel');sel.innerHTML='';
  var allBtn=document.createElement('button');
  allBtn.className='gf-btn'+(gUnit===0?' on':'');
  allBtn.textContent=gu.unitAll+' ('+gGetNouns(0).length+')';
  allBtn.onclick=function(){gUnit=0;gBuildStart();};sel.appendChild(allBtn);
  for(var i=1;i<=8;i++){
    var cnt=gGetNouns(i).length;if(!cnt)continue;
    (function(u){var b=document.createElement('button');
    b.className='gf-btn'+(gUnit===u?' on':'');
    b.textContent=gu.unit+' '+u+' ('+cnt+')';
    b.onclick=function(){gUnit=u;gBuildStart();};sel.appendChild(b);})(i);
  }
  var sb=document.getElementById('ga-start-btn');
  sb.textContent=gu.start;
  sb.onclick=function(){gCorrect=0;gWrong=0;gRound=0;gInitPool(gUnit);gShowGame();};
}
function gShowGame(){
  document.getElementById('ga-start').style.display='none';
  document.getElementById('ga-active').style.display='flex';
  document.getElementById('ga-result-screen').style.display='none';
  gLoadQ();
}
function gLoadQ(){
  gAnswered=false;gCurrent=gPick();
  if(!gCurrent){gShowResult();return;}
  var w=gCurrent.word;
  var gu=GAME_UI[lang]||GAME_UI.tr;
  document.getElementById('ga-card').className='game-card';
  document.getElementById('ga-result').textContent='';
  document.getElementById('ga-result').className='gc-result';
  document.getElementById('ga-unit').textContent=gu.unit+' '+w.unit;
  document.getElementById('ga-word').textContent=w.de.replace(/^(der|die|das)\s/i,'');
  document.getElementById('ga-hint').textContent=transInfo(w.info)||'';
  var pct=Math.min((gRound/G_ROUND)*100,100);
  document.getElementById('ga-prog').style.width=pct+'%';
  document.getElementById('ga-ok').textContent=gCorrect;
  document.getElementById('ga-err').textContent=gWrong;
  var wbar=document.getElementById('ga-wbar');
  if(gCurrent.wrong>0){
    var h='<span style="font-size:.6rem">'+gu.hotTip+'</span>';
    var heat=Math.min(gCurrent.wrong,5);
    for(var i=0;i<5;i++)h+='<span class="wb-dot'+(i<heat?' hot':'')+'"></span>';
    wbar.innerHTML=h;
  } else {wbar.innerHTML='';}
  ['ab-der','ab-die','ab-das'].forEach(function(id){var b=document.getElementById(id);b.disabled=false;b.className='art-btn b-'+id.replace('ab-','');});
  document.getElementById('ga-next').style.display='none';
}
function checkArt(chosen){
  if(gAnswered)return;gAnswered=true;
  var correct=gCurrent.word.art;
  var gu=GAME_UI[lang]||GAME_UI.tr;
  ['ab-der','ab-die','ab-das'].forEach(function(id){document.getElementById(id).disabled=true;});
  var cb=document.getElementById('ab-'+chosen);
  var okb=document.getElementById('ab-'+correct);
  if(chosen===correct){
    cb.classList.add('sel-ok');
    document.getElementById('ga-card').classList.add('flash-ok');
    document.getElementById('ga-result').textContent='✓ '+gu.correct;
    document.getElementById('ga-result').className='gc-result ok';
    gCorrect++;gCurrent.weight=Math.max(1,gCurrent.weight*0.6);
  } else {
    cb.classList.add('sel-err');okb.classList.add('reveal-ok');
    document.getElementById('ga-card').classList.add('flash-err');
    var tr=gCurrent.word[lang]||gCurrent.word.tr||'';
    document.getElementById('ga-result').textContent='✗ '+gu.wrong+' → '+correct.toUpperCase()+' '+gCurrent.word.de.replace(/^(der|die|das)\s/i,'')+(tr?' ('+tr+')':'');
    document.getElementById('ga-result').className='gc-result err';
    gWrong++;gCurrent.weight=Math.min(gCurrent.weight*3,20);gCurrent.wrong++;
  }
  gCurrent.seen++;gRound++;gSave();
  document.getElementById('ga-next').style.display='inline-block';
  var _ans=gAnswered;setTimeout(function(){if(_ans&&gAnswered)nextArt();},1200);
}
function nextArt(){document.getElementById('ga-next').style.display='none';if(gRound>=G_ROUND)gShowResult();else gLoadQ();}
function gShowResult(){
  document.getElementById('ga-active').style.display='none';
  document.getElementById('ga-result-screen').style.display='block';
  document.getElementById('ga-prog').style.width='100%';
  var gu=GAME_UI[lang]||GAME_UI.tr;
  var total=gCorrect+gWrong;var pct=total>0?Math.round(gCorrect/total*100):0;
  document.getElementById('gr-emoji').textContent=pct>=80?'🏆':pct>=50?'👍':'💪';
  document.getElementById('gr-title').textContent=gu.sub(pct);
  document.getElementById('gr-sub').textContent=gCorrect+' / '+total;
  document.getElementById('gr-ok').textContent=gCorrect;document.getElementById('gr-err').textContent=gWrong;
  document.getElementById('gr-pct').textContent=pct+'%';
  document.getElementById('gr-ok-lbl').textContent=gu.okLbl;document.getElementById('gr-err-lbl').textContent=gu.errLbl;
  document.getElementById('gr-pct-lbl').textContent=gu.pctLbl;
  document.getElementById('gr-menu').textContent=gu.menu;document.getElementById('gr-menu').onclick=function(){gBack();};
  document.getElementById('gr-again').textContent=gu.again;document.getElementById('gr-again').onclick=function(){gCorrect=0;gWrong=0;gRound=0;gInitPool(gUnit);document.getElementById('ga-result-screen').style.display='none';document.getElementById('ga-active').style.display='flex';gLoadQ();};
}
function gBack(){
  document.getElementById('ga-active').style.display='none';
  document.getElementById('ga-result-screen').style.display='none';
  document.getElementById('ga-start').style.display='block';
}

</script>

</html>
