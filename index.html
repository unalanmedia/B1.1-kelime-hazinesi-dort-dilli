<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UnalandTech – B1.1 Deutscher Wortschatz</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&family=Noto+Sans+Arabic:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060810;
    --surface: #0d1117;
    --card: #111827;
    --card-hover: #1a2235;
    --accent: #00b4f0;
    --accent2: #0066cc;
    --accent-glow: rgba(0,180,240,0.15);
    --text: #e8f4ff;
    --muted: #6b7fa3;
    --border: rgba(0,180,240,0.12);
    --border-solid: rgba(255,255,255,0.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  /* SPLASH SCREEN */
  #splash {
    position: fixed; inset: 0; z-index: 9999;
    background: #060810;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 0;
  }
  #splash::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 60% 50% at 50% 40%, rgba(0,100,200,0.18) 0%, transparent 70%);
    pointer-events: none;
  }
  .splash-logo {
    width: 100px; height: 100px;
    object-fit: contain;
    filter: drop-shadow(0 0 30px rgba(0,180,240,0.5));
    animation: logoFloat 3s ease-in-out infinite;
    margin-bottom: 1.2rem;
  }
  @keyframes logoFloat {
    0%,100% { transform: translateY(0px); }
    50% { transform: translateY(-8px); }
  }
  .splash-title {
    font-family: 'DM Sans', sans-serif;
    font-size: 1.6rem; font-weight: 300;
    color: var(--text); letter-spacing: 2px;
    margin-bottom: 0.3rem;
  }
  .splash-title span { color: var(--accent); font-weight: 500; }
  .splash-subtitle {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem; color: var(--muted);
    letter-spacing: 3px; text-transform: uppercase;
    margin-bottom: 3rem;
  }
  .lang-prompt {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem; color: var(--muted);
    margin-bottom: 1.2rem;
    letter-spacing: 0.5px;
  }
  .lang-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
    width: 340px;
  }
  .lang-btn {
    background: rgba(0,180,240,0.05);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1rem 1.2rem;
    cursor: pointer;
    display: flex; align-items: center; gap: 0.75rem;
    transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    position: relative; overflow: hidden;
  }
  .lang-btn::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(0,180,240,0.1), transparent);
    opacity: 0; transition: opacity 0.25s;
  }
  .lang-btn:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,180,240,0.2); }
  .lang-btn:hover::before { opacity: 1; }
  .lang-flag { font-size: 1.6rem; }
  .lang-name { font-size: 0.95rem; font-weight: 500; }
  .lang-native { font-size: 0.72rem; color: var(--muted); margin-top: 0.1rem; }
  .splash-brand {
    position: absolute; bottom: 1.5rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.72rem; color: var(--muted);
    letter-spacing: 1px;
  }
  .splash-brand span { color: var(--accent); }

  /* MAIN APP */
  #app { display: none; flex-direction: column; min-height: 100vh; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; }

  header {
    background: linear-gradient(180deg, #0a1020 0%, transparent 100%);
    border-bottom: 1px solid var(--border-solid);
    padding: 1rem 1.5rem;
    position: sticky; top: 0; z-index: 100;
    backdrop-filter: blur(20px);
  }
  .header-top {
    display: flex; align-items: center; gap: 1rem; margin-bottom: 0.75rem;
  }
  .header-logo { height: 26px; width: 26px; object-fit: contain; opacity: 0.65; }
  .header-brand { font-size: 0.82rem; font-weight: 400; color: var(--muted); letter-spacing: 0.3px; }
  .header-brand span { color: rgba(0,180,240,0.7); }
  .header-right { margin-left: auto; }
  .lang-switch-btn {
    background: rgba(0,180,240,0.08);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.4rem 0.8rem;
    color: var(--accent);
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'DM Sans', sans-serif;
  }
  .lang-switch-btn:hover { background: rgba(0,180,240,0.15); }

  .controls { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }
  input[type="text"] {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border-solid);
    color: var(--text);
    padding: 0.45rem 1rem;
    border-radius: 8px; font-size: 0.85rem;
    width: 200px; outline: none;
    transition: border 0.2s;
    font-family: 'DM Sans', sans-serif;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  input[type="text"]::placeholder { color: var(--muted); }
  .filter-group { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .filter-btn {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border-solid);
    color: var(--muted);
    padding: 0.35rem 0.75rem;
    border-radius: 16px; font-size: 0.78rem;
    cursor: pointer; transition: all 0.2s;
    font-family: 'DM Sans', sans-serif;
  }
  .filter-btn:hover, .filter-btn.active {
    background: var(--accent2); border-color: var(--accent);
    color: white;
  }
  .stats { color: var(--muted); font-size: 0.78rem; margin-left: auto; }

  main { padding: 1.2rem 1.5rem; max-width: 1400px; margin: 0 auto; flex: 1; }
  .section { margin-bottom: 2rem; }
  .section-header {
    display: flex; align-items: center; gap: 0.75rem;
    margin-bottom: 0.85rem; padding-bottom: 0.6rem;
    border-bottom: 1px solid var(--border-solid);
  }
  .section-icon { font-size: 1rem; }
  .section-title { font-size: 1.05rem; font-weight: 500; color: var(--text); }
  .section-badge {
    padding: 0.15rem 0.6rem; border-radius: 20px;
    font-size: 0.7rem; font-weight: 500;
  }
  .badge-isim { background: rgba(0,102,204,0.2); color: #60a5fa; border: 1px solid rgba(0,102,204,0.3); }
  .badge-fiil { background: rgba(0,180,100,0.15); color: #34d399; border: 1px solid rgba(0,180,100,0.3); }
  .badge-sifat { background: rgba(200,130,0,0.15); color: #fbbf24; border: 1px solid rgba(200,130,0,0.3); }
  .badge-zarf { background: rgba(180,0,200,0.12); color: #c084fc; border: 1px solid rgba(180,0,200,0.25); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 0.5rem;
  }
  .word-card {
    background: var(--card);
    border: 1px solid var(--border-solid);
    border-radius: 10px; padding: 0.65rem 0.85rem;
    display: flex; align-items: flex-start; gap: 0.65rem;
    transition: transform 0.15s, border-color 0.15s, background 0.15s;
    cursor: default;
  }
  .word-card:hover {
    transform: translateY(-1px);
    border-color: rgba(0,180,240,0.3);
    background: var(--card-hover);
  }
  .art-badge {
    font-size: 0.6rem; font-weight: 700;
    padding: 0.12rem 0.4rem; border-radius: 4px;
    flex-shrink: 0; margin-top: 2px;
    letter-spacing: 0.5px; text-transform: uppercase;
  }
  .art-der { background: #1d4ed8; color: white; }
  .art-die { background: #be123c; color: white; }
  .art-das { background: #15803d; color: white; }
  .art-v { background: #0e7490; color: white; }
  .art-adj { background: #92400e; color: white; }
  .art-adv { background: #6b21a8; color: white; }

  .word-body { flex: 1; min-width: 0; }
  .word-de { font-weight: 500; font-size: 0.88rem; color: var(--text); line-height: 1.3; }
  .word-gram { font-size: 0.7rem; color: var(--accent); margin-top: 0.1rem; opacity: 0.8; }
  .word-tr { font-size: 0.8rem; color: var(--muted); margin-top: 0.15rem; line-height: 1.3; }
  .word-tr.rtl { direction: rtl; text-align: right; font-family: 'Noto Sans Arabic', sans-serif; }
  .unit-dot {
    font-size: 0.6rem; padding: 0.08rem 0.35rem;
    border-radius: 3px; background: rgba(255,255,255,0.05);
    color: var(--muted); flex-shrink: 0; margin-top: 2px;
  }

  footer {
    border-top: 1px solid var(--border-solid);
    padding: 1rem 1.5rem;
    display: flex; align-items: center; gap: 0.75rem;
    justify-content: center;
  }
  .footer-logo { height: 18px; opacity: 0.4; }
  .footer-text { font-size: 0.68rem; color: rgba(107,127,163,0.6); }
  .footer-text span { color: var(--accent); }

  /* splash transition */
  #splash.fade-out { animation: fadeOut 0.5s forwards; }
  @keyframes fadeOut { to { opacity: 0; pointer-events: none; } }
  #app.fade-in { animation: fadeIn 0.5s forwards; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  @media (max-width: 600px) {
    .lang-grid { width: 100%; padding: 0 1rem; }
    header, main { padding: 0.8rem 1rem; }
    .grid { grid-template-columns: 1fr; }
    input[type="text"] { width: 100%; }
  }

</style>
</head>
<body>
<!-- SPLASH -->
<div id="splash">
  <img class="splash-logo" id="splash-logo" src="" alt="UnalandTech">
  <div class="splash-title">Unaland<span>Tech</span></div>
  <div class="splash-subtitle">B1.1 Deutscher Wortschatz</div>
  <div class="lang-prompt" id="lang-prompt">Bitte wählen Sie eine Sprache aus / Please select a language</div>
  <div class="lang-grid">
    <button class="lang-btn" onclick="selectLang('tr')">
      <span class="lang-flag">🇹🇷</span>
      <div><div class="lang-name">Türkçe</div><div class="lang-native">Turkish</div></div>
    </button>
    <button class="lang-btn" onclick="selectLang('en')">
      <span class="lang-flag">🇬🇧</span>
      <div><div class="lang-name">English</div><div class="lang-native">Englisch</div></div>
    </button>
    <button class="lang-btn" onclick="selectLang('ar')">
      <span class="lang-flag">🇸🇦</span>
      <div><div class="lang-name">العربية</div><div class="lang-native">Arabisch</div></div>
    </button>
    <button class="lang-btn" onclick="selectLang('fa')">
      <span class="lang-flag">🇮🇷</span>
      <div><div class="lang-name">فارسی</div><div class="lang-native">Persisch</div></div>
    </button>
  </div>
  <div class="splash-brand">© 2025 <span>UnalandTech</span> · Alle Rechte vorbehalten</div>
</div>

<!-- MAIN APP -->
<div id="app">
  <header>
    <div class="header-top">
      <img class="header-logo" id="app-logo" src="" alt="UnalandTech">
      <div class="header-brand">Unaland<span>Tech</span></div>
      <div class="header-right">
        <button class="lang-switch-btn" onclick="backToSplash()" id="lang-switch-btn">🌐 Sprache ändern</button>
      </div>
    </div>
    <div class="controls">
      <input type="text" id="search" placeholder="🔍 Wort suchen…" oninput="renderWords()">
      <div class="filter-group" id="type-filters">
        <button class="filter-btn active" data-type="all" onclick="setType('all',this)">Alle</button>
        <button class="filter-btn" data-type="isim" onclick="setType('isim',this)">Nomen</button>
        <button class="filter-btn" data-type="fiil" onclick="setType('fiil',this)">Verben</button>
        <button class="filter-btn" data-type="sifat" onclick="setType('sifat',this)">Adjektive</button>
        <button class="filter-btn" data-type="zarf" onclick="setType('zarf',this)">Umschläge</button>
      </div>
      <div class="filter-group">
        <button class="filter-btn active" data-unit="0" onclick="setUnit(0,this)">Alle Einheiten</button>
        <button class="filter-btn" data-unit="1" onclick="setUnit(1,this)">Ü1</button>
        <button class="filter-btn" data-unit="2" onclick="setUnit(2,this)">Ü2</button>
        <button class="filter-btn" data-unit="3" onclick="setUnit(3,this)">Ü3</button>
        <button class="filter-btn" data-unit="4" onclick="setUnit(4,this)">Ü4</button>
        <button class="filter-btn" data-unit="5" onclick="setUnit(5,this)">Ü5</button>
        <button class="filter-btn" data-unit="6" onclick="setUnit(6,this)">Ü6</button>
        <button class="filter-btn" data-unit="7" onclick="setUnit(7,this)">Ü7</button>
        <button class="filter-btn" data-unit="8" onclick="setUnit(8,this)">Ü8</button>
      </div>
      <span class="stats" id="stats"></span>
    </div>
  </header>

  <main id="main-content"></main>

  <footer>
    <img class="footer-logo" id="footer-logo" src="" alt="UnalandTech">
    <div class="footer-text">© 2026 Es wurde von <span>UnalandTech</span> erstellt. · Deutscher Wortschatz</div>
  </footer>
</div>

let currentLang = 'tr';
let activeType = 'all';
let activeUnit = 0;

function selectLang(lang) {
  currentLang = lang;
  const splash = document.getElementById('splash');
  const app = document.getElementById('app');
  splash.classList.add('fade-out');
  setTimeout(() => {
    splash.style.display = 'none';
    app.style.display = 'flex';
    app.classList.add('fade-in');
    applyLangUI();
    renderWords();
  }, 500);
}

function backToSplash() {
  const splash = document.getElementById('splash');
  const app = document.getElementById('app');
  app.style.display = 'none';
  splash.style.display = 'flex';
  splash.classList.remove('fade-out');
}

function applyLangUI() {
  const ui = UI[currentLang];
  document.getElementById('lang-switch-btn').textContent = ui.switchBtn;
  document.getElementById('search').placeholder = ui.search;
  document.querySelector('[data-type="all"]').textContent = ui.allTypes;
  document.querySelector('[data-type="isim"]').textContent = ui.nouns;
  document.querySelector('[data-type="fiil"]').textContent = ui.verbs;
  document.querySelector('[data-type="sifat"]').textContent = ui.adj;
  document.querySelector('[data-type="zarf"]').textContent = ui.adv;
  document.querySelector('[data-unit="0"]').textContent = ui.allUnits;
  document.getElementById('footer-text') && (document.querySelector('.footer-text').innerHTML = '© 2025 <span style="color:var(--accent)">UnalandTech</span> ' + (currentLang === 'tr' ? 'tarafından oluşturulmuştur' : currentLang === 'en' ? 'Created by' : currentLang === 'ar' ? 'أنشأته' : 'ساخته شده توسط'));
}

function setType(t, btn) {
  activeType = t;
  document.querySelectorAll('[data-type]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderWords();
}
function setUnit(u, btn) {
  activeUnit = u;
  document.querySelectorAll('[data-unit]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderWords();
}

function artClass(art) {
  const m = {der:'art-der',die:'art-die',das:'art-das',v:'art-v',adj:'art-adj',adv:'art-adv'};
  return m[art] || 'art-adv';
}
function artLabel(art, lang) {
  if(art==='der') return 'DER';
  if(art==='die') return 'DIE';
  if(art==='das') return 'DAS';
  const vLabel = {tr:'FİİL',en:'VERB',ar:'فعل',fa:'فعل'};
  const adjLabel = {tr:'SIFAT',en:'ADJ',ar:'صفة',fa:'صفت'};
  const advLabel = {tr:'ZARF',en:'ADV',ar:'ظرف',fa:'قید'};
  if(art==='v') return vLabel[lang]||'VERB';
  if(art==='adj') return adjLabel[lang]||'ADJ';
  if(art==='adv') return advLabel[lang]||'ADV';
  return art.toUpperCase();
}

function renderWords() {
  const ui = UI[currentLang];
  const q = document.getElementById('search').value.toLowerCase();
  const sections = [
    {key:'isim', label: ui.secNouns, badge:'badge-isim', icon:'📖'},
    {key:'fiil', label: ui.secVerbs, badge:'badge-fiil', icon:'⚡'},
    {key:'sifat', label: ui.secAdj, badge:'badge-sifat', icon:'🎨'},
    {key:'zarf', label: ui.secAdv, badge:'badge-zarf', icon:'🔗'},
  ];
  let totalVisible = 0;
  let html = '';
  for(const sec of sections) {
    if(activeType !== 'all' && activeType !== sec.key) continue;
    let items = words.filter(w => {
      if(w.type !== sec.key) return false;
      if(activeUnit !== 0 && w.unit !== activeUnit) return false;
      const trans = w[currentLang] || w.tr;
      if(q && !w.de.toLowerCase().includes(q) && !trans.toLowerCase().includes(q)) return false;
      return true;
    });
    if(!items.length) continue;
    totalVisible += items.length;
    const badgeCount = {tr:`${items.length} kelime`,en:`${items.length} words`,ar:`${items.length} كلمة`,fa:`${items.length} کلمه`};
    html += `<div class="section">
      <div class="section-header">
        <span class="section-icon">${sec.icon}</span>
        <h2 class="section-title">${sec.label}</h2>
        <span class="section-badge ${sec.badge}">${badgeCount[currentLang]}</span>
      </div>
      <div class="grid">`;
    for(const w of items) {
      const trans = w[currentLang] || w.tr;
      const isRTL = ui.rtl;
      html += `<div class="word-card">
        <span class="art-badge ${artClass(w.art)}">${artLabel(w.art, currentLang)}</span>
        <div class="word-body">
          <div class="word-de">${w.de}</div>
          ${w.info ? `<div class="word-gram">${w.info}</div>` : ''}
          <div class="word-tr${isRTL?' rtl':''}">${trans}</div>
        </div>
        <span class="unit-dot">Ü${w.unit}</span>
      </div>`;
    }
    html += `</div></div>`;
  }
  document.getElementById('main-content').innerHTML = html;
  document.getElementById('stats').textContent = ui.stats(totalVisible);
}
